name: Fetch GCP Secret

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fetch-secret:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # WIF ke liye must hai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch secret from Secret Manager
        run: |
          SECRET_VALUE=$(gcloud secrets versions access latest \
            --secret="my-app-secret" \
            --project="project-eefd8d29-a5e4-42f7-964")
          echo "::add-mask::$SECRET_VALUE"
          echo "SECRET_VALUE=$SECRET_VALUE" >> $GITHUB_ENV

      - name: Use secret (example)
        run: |
          echo "Secret fetched successfully"
          # yahan apna actual command use karo jo secret chahiye
